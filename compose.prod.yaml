services:
  web:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      - app2026-storage-production:/var/www/storage:ro
      - app2026-public:/var/www/public:ro
    networks:
      - app2026-production
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    image: app2026-php-fpm
    restart: unless-stopped
    volumes:
      - app2026-public:/var/www/public
      - app2026-storage-production:/var/www/storage
    env_file:
      - .env
    networks:
      - app2026-production
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    image: app2026-php-fpm
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --max-time=3600
    volumes:
      - app2026-storage-production:/var/www/storage
    env_file:
      - .env
    environment:
      SKIP_MIGRATIONS: "1"
    networks:
      - app2026-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: app2026-php-fpm
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app2026-storage-production:/var/www/storage
    env_file:
      - .env
    environment:
      SKIP_MIGRATIONS: "1"
    networks:
      - app2026-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    user: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-app}
      - POSTGRES_USER=${POSTGRES_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
    volumes:
      - app2026-postgres-production:/var/lib/postgresql/data
    networks:
      - app2026-production
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - app2026-production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app2026-production:

volumes:
  app2026-postgres-production:
  app2026-storage-production:
  app2026-public:
